[Starfall.PassiveTypes]
0=Install
1=ParentBuff
2=Shield
3=LocalShield
4=SkipMe
5=UpgradeLeft
6=CheckDismantling
7=RecycleNewest
8=PaymentOnDeath
9=RecycleAll

[RecycleAll]
Trigger=OnPassiveGained
Action=RemoveAttachedUnit
Action.Count=All

[UpgradeLeft]
Trigger=OnPassiveGained
Actions=DetachOldGun,FitNewGun

[DetachOldGun]
Action=RemoveAttachedUnit
Action.Slot=Left
Action.UnitType=MTNK

[FitNewGun]
Action=AttachUnit
Action.Node=Left
Action.UnitType=E1

[CheckDismantling]
Trigger=OnPassiveGained
Action=RunScript
Action.Script=Dismantle.lua
Action.Function=check

[RecycleNewest]
Trigger=OnPassiveGained
Action=RemoveAttachedUnit

[PaymentOnDeath]
Trigger=OnDeath
Action=GiveCredits
Action.Amount=500

[Install]
Trigger=OnPassiveGained
Action=AttachUnit
Action.Target=Self
Action.Slot=Auto
Action.UnitType=MTNK
Action.ExcludeParentPassives=SkipMe,Shield

[MTNK]
AttachSlots=left,right
AttachNode.left.FLH=0,96,120
AttachNode.right.FLH=0,-96,120

[ORCA]
AttachSlots=a,b,c,d

[GAPOWR]
AttachSlots=roof
AttachNode.roof.FLH=32,48,128

[ParentBuff]
Trigger=WhileState
Modifier.FirepowerMultiplier=1.5
Modifier.FireRateMultiplier=1.3
Modifier.MultiShot=1

[SkipMe]
Trigger=WhileState
Modifier.ArmorMultiplier=2

[Shield]
Trigger=WhileState
Modifier.Immune=yes

[LocalShield]
Trigger=WhileState
Modifier.Immune=yes
