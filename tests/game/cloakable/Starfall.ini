[Starfall.PassiveTypes]
0=DelayedCloak
1=AlwaysCloak
2=CloakOff
3=InvalidCloakValue
4=InvalidCloakEvent
5=InvalidCloakCondition
6=LinkA
7=LinkNested
8=LinkOther
9=LinkGained
10=LinkCycle
11=LinkMissing

[LinkA]
Trigger=WhileState
Condition.Formula=$(Self.Health >= Self.MaxHealth * 50%)
Modifier.LinkedPassives=LinkNested,LinkGained

[LinkNested]
Trigger=WhileState
Modifier.LinkedPassives=LinkGained

[LinkOther]
Trigger=WhileState
Modifier.LinkedPassives=LinkGained

[LinkGained]
Trigger=OnPassiveGained
MaxTriggers=100
Action=GiveCredits
Action.Amount=1

[LinkCycle]
Trigger=WhileState
Modifier.LinkedPassives=LinkCycle

[LinkMissing]
Trigger=WhileState
Modifier.LinkedPassives=MissingID

[DelayedCloak]
Trigger=WhileState
Condition.Formula=$(Self.Health <= Self.MaxHealth * 50%)
Condition.StateDurationSeconds=1
Modifier.Cloakable=yes

[AlwaysCloak]
Trigger=WhileState
Modifier.Cloakable=yes

[CloakOff]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Cloakable=no
Modifier.FirepowerMultiplier=1.1

[InvalidCloakValue]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Cloakable=true

[InvalidCloakEvent]
Trigger=OnKill
Modifier.Cloakable=yes
Action=Heal
Action.Amount=1

[InvalidCloakCondition]
Trigger=WhileState
Modifier.Cloakable=yes
