[Starfall.Research]
InitialPoints=1000
AllowCardRefresh=yes
SharedRaritySequence=yes
RarityWeight.Common=1
RarityWeight.Rare=1
RarityWeight.Epic=1

[GAPOWR]
Starfall.ResearchOptions=NetA,NetB,NetC,RareA,RareB,RareC,EpicA,EpicB,EpicC
Starfall.ResearchOptions.AllowSpyInfiltration=yes

[Starfall.PassiveTypes]
0=MP_Cast
1=MP_Random
2=MP_Cloak
3=MP_Mount
4=MP_StripGuns
5=MP_MoveOrder
6=MP_DroneGuard

[MP_DroneGuard]
Trigger=OnPassiveGained
Action=RunScript
Action.Script=Network.lua
Action.Function=guardOrder

[MP_MoveOrder]
Trigger=OnPassiveGained
Action=RunScript
Action.Script=Network.lua
Action.Function=moveOrder

[MP_StripGuns]
Trigger=OnPassiveGained
Action=RemoveAttachedUnit
Action.Slot=Gun
Action.UnitType=E1
Action.Count=All

[MP_Mount]
Trigger=OnPassiveGained
Action=AttachUnit
Action.UnitType=E1
Action.Slot=Auto

[MTNK]
AttachSlots=Port
AttachNode.Port.FLH=0,80,100

[GTGCAN]
AttachSlots=Gun
AttachNode.Gun.Anchor=Turret
AttachNode.Gun.FLH=128,0,120

[MP_Cloak]
Trigger=WhileState
Condition.Formula=$(1)
Modifier.Cloakable=yes

[MP_Cast]
Trigger=Active
Active.Target=Unit
Active.Range=12
Active.InterruptOrders=no
Cooldown=90
Action=RunScript
Action.Script=Network.lua
Action.Function=cast

[MP_Random]
Trigger=OnInterval
Interval=15
Chance=43%
Action=GiveResearchPoints
Action.Amount=1

